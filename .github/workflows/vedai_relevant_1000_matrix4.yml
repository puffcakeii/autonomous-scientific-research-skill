name: VEDAI relevant 1000-paper fast matrix audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vedai_relevant_1000_matrix4.yml'
      - 'scripts/vedai_lit_parts/**'

permissions:
  contents: read

env:
  TARGET_N: '1000'
  YEAR_MIN: '2021'
  YEAR_MAX: '2026'
  MIN_WORDS: '2600'
  MAX_PDF_MB: '60'
  AUDIT_CACHE: .cache/vedai_literature

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pymupdf numpy pandas scikit-learn
      - name: Build broad but quality-controlled metadata pool
        run: |
          cat scripts/vedai_lit_parts/part_*.b64 | base64 --decode > /tmp/auditlib.py
          PYTHONPATH=/tmp python - <<'PY'
          import dataclasses, json, time
          import requests
          import auditlib

          queries={
            'rgbt_multispectral_detection':'multispectral infrared thermal RGB object detection',
            'hyperspectral_band_learning':'hyperspectral spectral band selection spatial learning',
            'missing_modality_variable_channels':'missing modality arbitrary modality variable channel multimodal',
            'sensor_failure_robustness':'sensor failure robust multimodal fusion corruption reliability',
            'aerial_oriented_small_detection':'aerial oriented rotated small object detection remote sensing',
            'fusion_alignment_registration':'multimodal fusion alignment registration object detection',
            'domain_shift_tta_generalization':'domain generalization adaptation remote sensing multimodal perception',
            'evaluation_statistics_calibration':'object detection calibration uncertainty statistical evaluation cross validation',
            'efficient_deployment_selection':'efficient multimodal sensor selection dynamic modality deployment',
          }
          select='id,doi,title,publication_year,cited_by_count,abstract_inverted_index,primary_location,best_oa_location,locations,ids,type'
          merged={}
          s=auditlib.session()
          for fam,q in queries.items():
              cursor='*'
              for page in range(5):
                  params={'search':q,'filter':'from_publication_date:2021-01-01,to_publication_date:2026-12-31,is_oa:true','per-page':200,'cursor':cursor,'select':select}
                  r=s.get(auditlib.OPENALEX,params=params,timeout=20); r.raise_for_status(); data=r.json()
                  for w in data.get('results') or []:
                      oid=w.get('id')
                      if not oid: continue
                      rec=merged.setdefault(oid,{'work':w,'families':set()}); rec['families'].add(fam)
                  cursor=(data.get('meta') or {}).get('next_cursor')
                  if not cursor: break
                  time.sleep(.1)
              print(fam,len(merged))
          works=[]
          for oid,rec in merged.items():
              w=rec['work']; venue=auditlib.match_venue(w)
              if not venue: continue
              year=int(w.get('publication_year') or 0)
              title=auditlib.norm_space(w.get('title') or '')
              if not title or not (2021<=year<=2026): continue
              urls=auditlib.candidate_pdf_urls(w)
              if not urls: continue
              abstract=auditlib.reconstruct_abstract(w.get('abstract_inverted_index'))
              canonical,tier=venue
              doi=str(w.get('doi') or '').lower().replace('https://doi.org/','')
              landing=''
              for loc in [w.get('primary_location'),w.get('best_oa_location')]:
                  if isinstance(loc,dict) and loc.get('landing_page_url'):
                      landing=str(loc['landing_page_url']); break
              obj=auditlib.Work(openalex_id=oid,title=title,year=year,doi=doi,venue=canonical,venue_tier=tier,cited_by_count=int(w.get('cited_by_count') or 0),abstract=abstract,pdf_url='\n'.join(urls[:8]),landing_url=landing,query_families=set(rec['families']))
              obj.metadata_score=auditlib.metadata_relevance(title,abstract,obj.query_families,obj.cited_by_count,year,tier)
              works.append(obj)
          works.sort(key=lambda x:x.metadata_score,reverse=True)
          dedup={}
          for w in works:
              key='doi:'+w.doi if w.doi else 'title:'+auditlib.norm_title(w.title)
              if key not in dedup: dedup[key]=w
              else: dedup[key].query_families.update(w.query_families)
          works=list(dedup.values())[:7000]
          rows=[]
          for w in works:
              d=dataclasses.asdict(w); d['query_families']=sorted(d['query_families']); rows.append(d)
          open('candidates.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False))
          print('quality metadata candidates',len(rows))
          assert len(rows)>=1800,len(rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vedai-fast-candidates
          path: candidates.json
          compression-level: 9
          retention-days: 3

  shard:
    needs: metadata
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pymupdf numpy pandas scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: vedai-fast-candidates
          path: input
      - name: Parse quality full texts for shard ${{ matrix.shard }}
        env:
          SHARD_ID: ${{ matrix.shard }}
          SHARD_N: '8'
        run: |
          cat scripts/vedai_lit_parts/part_*.b64 | base64 --decode > /tmp/auditlib.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/auditlib.py'); s=p.read_text().replace('timeout=90','timeout=15')
          old='    for url in urls:\n'
          new='''    preferred_hosts=("arxiv.org","openaccess.thecvf.com","papers.nips.cc","proceedings.neurips.cc","proceedings.mlr.press","openreview.net")\n    fast_urls=[u for u in urls if any(h in u for h in preferred_hosts)]\n    for url in fast_urls[:3]:\n'''
          if old not in s: raise SystemExit('URL loop not found')
          p.write_text(s.replace(old,new,1))
          PY
          PYTHONPATH=/tmp python - <<'PY'
          import concurrent.futures as cf, gzip, json, os, pickle, shutil, tempfile
          from pathlib import Path
          import auditlib
          sid=int(os.environ['SHARD_ID']); nsh=int(os.environ['SHARD_N'])
          raw=json.load(open('input/candidates.json',encoding='utf-8'))
          works=[]
          for d in raw:
              d['query_families']=set(d['query_families']); works.append(auditlib.Work(**d))
          works=[w for i,w in enumerate(works) if i%nsh==sid][:750]
          root=Path(tempfile.mkdtemp(prefix=f'vedai_fast_{sid}_')); eligible=[]
          try:
              with cf.ThreadPoolExecutor(max_workers=18) as ex:
                  futs={ex.submit(auditlib.download_one,w,i,root):w for i,w in enumerate(works)}
                  for fut in cf.as_completed(futs):
                      try: rec=fut.result()
                      except Exception: rec=None
                      if rec: eligible.append(rec)
                      if len(eligible)>=185:
                          for p in futs: p.cancel()
                          break
              unique={}
              for rec in sorted(eligible,key=lambda r:(r['work']['venue_tier']=='A',r['work']['cited_by_count'],r['word_count']),reverse=True): unique.setdefault(rec['pdf_sha256'],rec)
              eligible=list(unique.values())
              with gzip.open(f'shard_{sid}.pkl.gz','wb',compresslevel=6) as f: pickle.dump(eligible,f,pickle.HIGHEST_PROTOCOL)
              print('shard',sid,'eligible',len(eligible)); assert len(eligible)>=120,len(eligible)
          finally: shutil.rmtree(root,ignore_errors=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vedai-fast-shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.pkl.gz
          compression-level: 0
          retention-days: 3

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pymupdf numpy pandas scikit-learn
      - uses: actions/download-artifact@v4
        with:
          pattern: vedai-fast-shard-*
          path: shards
          merge-multiple: true
      - name: Merge, select 1000, and rank all 18 questions
        run: |
          cat scripts/vedai_lit_parts/part_*.b64 | base64 --decode > /tmp/auditlib.py
          PYTHONPATH=/tmp python - <<'PY'
          import gzip,pickle,hashlib
          from pathlib import Path
          import auditlib
          allrec=[]
          for p in sorted(Path('shards').glob('shard_*.pkl.gz')):
              with gzip.open(p,'rb') as f: allrec.extend(pickle.load(f))
          unique={}
          for rec in sorted(allrec,key=lambda r:(r['work']['venue_tier']=='A',r['work']['cited_by_count'],r['word_count']),reverse=True): unique.setdefault(rec['pdf_sha256'],rec)
          eligible=list(unique.values()); print('unique full texts',len(eligible)); assert len(eligible)>=1000,len(eligible)
          selected=auditlib.balanced_select(eligible,1000)
          out=Path('artifacts/vedai_relevant_1000'); auditlib.write_outputs(selected,eligible,out); auditlib.rank_evidence(selected,out)
          lines=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file() and x.name!='SHA256SUMS.txt'): lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out).as_posix()}")
          (out/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python - <<'PY'
          import csv,json,pathlib
          r=pathlib.Path('artifacts/vedai_relevant_1000')
          rows=list(csv.DictReader((r/'registry_1000.csv').open(encoding='utf-8-sig'))); q=list(csv.DictReader((r/'question_evidence_matrix.csv').open(encoding='utf-8-sig'))); s=json.loads((r/'audit_summary.json').read_text())
          assert len(rows)==1000 and len(q)==900 and s['unique_fulltext_sha256']==1000 and s['method_experiment_result_complete']==1000 and s['word_count_min']>=2600
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vedai-relevant-1000-fulltext-audit-fast-matrix
          path: artifacts/vedai_relevant_1000
          compression-level: 9
          retention-days: 7
